[tox]
requires =
    tox>=4.2
env_list =
    lint
    type
    py3{14, 13, 12, 11, 10, 9}
skip_missing_interpreters = true

[testenv]
description = Run unit tests with pytest
deps =
    pytest>=7.3.1
    pytest-asyncio>=0.21
    pytest-cov>=4
    python-dotenv>=1
    requests-mock>=1.10
commands =
    pytest {posargs:-v --cov=brazilcep --cov-report=term-missing --cov-report=html}

[testenv:lint]
description = Run linting checks
skip_install = true
deps =
    black<24.0,>=23
    isort<5.13,>=5.12
    ruff>=0.1
commands =
    isort --check brazilcep tests
    black --check brazilcep tests
    ruff check brazilcep tests

[testenv:type]
description = Run type checking with mypy
deps =
    mypy<1.5,>=1
    types-requests
commands =
    mypy brazilcep

[testenv:docs]
description = Build documentation
deps =
    Sphinx<8,>=6
    myst-parser<2.1,>=1
    sphinx-autobuild==2021.3.14
    sphinx-autodoc-typehints==1.23.3
    sphinx-copybutton==0.5.2
change_dir = docs
commands =
    sphinx-build -W -b html source build

[testenv:format]
description = Format code with black and isort
skip_install = true
deps =
    black<24.0,>=23
    isort<5.13,>=5.12
commands =
    isort brazilcep tests
    black brazilcep tests

[testenv:coverage]
description = Generate coverage report
deps =
    pytest>=7.3.1
    pytest-asyncio>=0.21
    pytest-cov>=4
    python-dotenv>=1
    requests-mock>=1.10
commands =
    pytest --cov=brazilcep --cov-report=xml --cov-report=html --cov-report=term-missing

[testenv:clean]
description = Clean up build artifacts and caches
skip_install = true
commands =
    rm -rf .tox dist build *.egg-info .pytest_cache .mypy_cache .ruff_cache htmlcov .coverage coverage.xml
    find . -type d -name __pycache__ -exec rm -rf {} +
    find . -type f -name "*.pyc" -delete
allowlist_externals =
    find
    rm
